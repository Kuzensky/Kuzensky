name: Generate whoami card

on:
  push:
    paths:
      - README.md
      - scripts/generate_whoami_card.py
      - scripts/whoami_card_template.svg
      - .github/workflows/whoami-card.yml
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: whoami-card
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Prepare output
        run: mkdir -p dist

      - name: Generate whoami card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --disable-pip-version-check requests
          python scripts/generate_whoami_card.py dist

      - name: Publish generated card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/output >/dev/null 2>&1; then
            git fetch origin output
            git worktree add /tmp/whoami-output FETCH_HEAD
          else
            git worktree add --detach /tmp/whoami-output
            cd /tmp/whoami-output
            git checkout --orphan output
            git rm -rf . >/dev/null 2>&1 || true
            cd -
          fi
          rm -f /tmp/whoami-output/whoami-alt.svg
          cp -f dist/* /tmp/whoami-output/
          cd /tmp/whoami-output
          git add .
          git diff --cached --quiet || git commit -m "Update whoami card"
          git push origin HEAD:output
