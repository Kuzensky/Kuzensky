<svg width="700" height="460" viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="contentClip">
      <rect x="1" y="49" width="698" height="410" rx="0"/>
    </clipPath>
  </defs>

  <!-- Browser body -->
  <rect x="0" y="0" width="700" height="460" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top chrome bar -->
  <path d="M0,14 a14,14 0 0 1 14,-14 h672 a14,14 0 0 1 14,14 v34 h-700 z" fill="#161b22"/>

  <!-- Traffic lights -->
  <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="6" fill="#febc2e"/>
  <circle cx="64" cy="24" r="6" fill="#28c840"/>

  <!-- Nav arrows -->
  <path d="M96,20 l-6,4 l6,4 z" fill="#8b949e"/>
  <path d="M116,20 l6,4 l-6,4 z" fill="#484f58"/>

  <!-- URL / search bar -->
  <rect x="140" y="10" width="420" height="28" rx="14" fill="#0d1117" stroke="#30363d"/>
  <!-- lock icon -->
  <rect x="158" y="20" width="9" height="7" rx="1.5" fill="#3fb950"/>
  <path d="M160,20 v-3 a2.5,2.5 0 0 1 5,0 v3" stroke="#3fb950" stroke-width="1.3" fill="none"/>
  <text x="176" y="28" font-family="Fira Code, Menlo, monospace" font-size="12.5" fill="#c9d1d9">github.com/kuzensky</text>

  <!-- refresh / search icon -->
  <circle cx="580" cy="24" r="9" fill="none" stroke="#8b949e" stroke-width="1.4"/>
  <path d="M580,17 l3,3 h-6 z" fill="#8b949e"/>

  <!-- Content area -->
  <rect x="1" y="49" width="698" height="410" fill="#0d1117"/>

  <g clip-path="url(#contentClip)">
    <!-- ASCII box logo -->
    <rect x="40" y="90" width="150" height="110" rx="4" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="58" y="106" width="26" height="8" rx="2" fill="#fbbf24"/>
    <rect x="92" y="106" width="26" height="8" rx="2" fill="#fbbf24"/>
    <text x="58" y="148" font-family="Fira Code, Menlo, monospace" font-size="13" fill="#fbbf24">&#183; github</text>
    <text x="58" y="178" font-family="Fira Code, Menlo, monospace" font-size="13" fill="#fbbf24">&gt; _</text>
    <rect x="80" y="167" width="8" height="13" fill="#fbbf24">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Stat block -->
    <text x="230" y="105" font-family="Fira Code, Menlo, monospace" font-size="16" font-weight="700" fill="#fbbf24">kuzensky@github</text>
    <line x1="230" y1="115" x2="660" y2="115" stroke="#21262d" stroke-width="1"/>

    <text x="230" y="150" font-family="Fira Code, Menlo, monospace" font-size="13" font-weight="700" fill="#fbbf24">Name</text>
    <text x="340" y="150" font-family="Fira Code, Menlo, monospace" font-size="13" fill="#f0f6fc">Christian Nayre</text>

    <text x="230" y="180" font-family="Fira Code, Menlo, monospace" font-size="13" font-weight="700" fill="#fbbf24">Role</text>
    <text x="340" y="180" font-family="Fira Code, Menlo, monospace" font-size="13" fill="#f0f6fc">Full-Stack Dev (mostly caffeine)</text>

    <text x="230" y="210" font-family="Fira Code, Menlo, monospace" font-size="13" font-weight="700" fill="#fbbf24">Stars</text>
    <text x="340" y="210" font-family="Fira Code, Menlo, monospace" font-size="13" fill="#f0f6fc">0</text>

    <text x="230" y="240" font-family="Fira Code, Menlo, monospace" font-size="13" font-weight="700" fill="#fbbf24">Repos</text>
    <text x="340" y="240" font-family="Fira Code, Menlo, monospace" font-size="13" fill="#f0f6fc">5</text>

    <text x="230" y="270" font-family="Fira Code, Menlo, monospace" font-size="13" font-weight="700" fill="#fbbf24">Followers</text>
    <text x="340" y="270" font-family="Fira Code, Menlo, monospace" font-size="13" fill="#f0f6fc">1</text>

    <text x="230" y="300" font-family="Fira Code, Menlo, monospace" font-size="13" font-weight="700" fill="#fbbf24">Top Lang</text>
    <text x="340" y="300" font-family="Fira Code, Menlo, monospace" font-size="13" fill="#f0f6fc">Blade</text>

    <text x="230" y="330" font-family="Fira Code, Menlo, monospace" font-size="13" font-weight="700" fill="#fbbf24">Activity</text>
    <text x="340" y="330" font-family="Fira Code, Menlo, monospace" font-size="13" fill="#f0f6fc">359 contributions</text>

    <!-- swatches -->
    <rect x="230" y="375" width="24" height="24" rx="4" fill="#fbbf24"/>
    <rect x="264" y="375" width="24" height="24" rx="4" fill="#56d4dd"/>
    <rect x="298" y="375" width="24" height="24" rx="4" fill="#5b8ef7"/>
    <rect x="332" y="375" width="24" height="24" rx="4" fill="#a684f2"/>
    <rect x="366" y="375" width="24" height="24" rx="4" fill="#ee7bb3"/>
    <rect x="400" y="375" width="24" height="24" rx="4" fill="#3fb950"/>
  </g>
</svg>
