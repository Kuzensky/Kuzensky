    <text x="28" y="88" fill="#58a6ff" opacity="0">booting christian.exe...
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1333;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
