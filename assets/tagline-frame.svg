    <text x="170" y="60" fill="#8b949e">:~$</text>
    <text x="206" y="60" fill="#8b949e">npm install christian</text>
    <rect x="186" y="48" width="10" height="16" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
