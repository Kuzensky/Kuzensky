    <text x="28" y="112" fill="#58a6ff" opacity="0">loading kabi.apk @ pocket devs...
      <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.2667;1" calcMode="discrete" dur="9s" repeatCount="indefinite"/>
