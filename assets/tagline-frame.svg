<svg width="700" height="220" viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="700" height="220" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <path d="M0,14 a14,14 0 0 1 14,-14 h672 a14,14 0 0 1 14,14 v12 h-700 z" fill="#161b22"/>
  <circle cx="24" cy="13" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="13" r="6" fill="#febc2e"/>
  <circle cx="64" cy="13" r="6" fill="#28c840"/>

  <text x="350" y="17" text-anchor="middle" font-family="Fira Code, Menlo, monospace" font-size="12.5" fill="#8b949e">kuzensky@github: ~$ ./boot.sh</text>

  <rect x="1" y="27" width="698" height="192" fill="#0d1117"/>

  <g font-family="Fira Code, Menlo, monospace" font-size="13" fill="#c9d1d9">
