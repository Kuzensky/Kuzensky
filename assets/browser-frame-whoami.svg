<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="contentClip">
      <rect x="1" y="49" width="698" height="370" rx="0"/>
    </clipPath>
  </defs>

  <!-- Browser body -->
  <rect x="0" y="0" width="700" height="420" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Top chrome bar -->
  <path d="M0,14 a14,14 0 0 1 14,-14 h672 a14,14 0 0 1 14,14 v34 h-700 z" fill="#161b22"/>

  <!-- Traffic lights -->
  <circle cx="24" cy="24" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="6" fill="#febc2e"/>
  <circle cx="64" cy="24" r="6" fill="#28c840"/>

  <!-- Nav arrows -->
  <path d="M96,20 l-6,4 l6,4 z" fill="#8b949e"/>
  <path d="M116,20 l6,4 l-6,4 z" fill="#484f58"/>

  <!-- URL bar -->
  <rect x="140" y="10" width="420" height="28" rx="14" fill="#0d1117" stroke="#30363d"/>
  <!-- lock icon -->
  <rect x="158" y="20" width="9" height="7" rx="1.5" fill="#3fb950"/>
  <path d="M160,20 v-3 a2.5,2.5 0 0 1 5,0 v3" stroke="#3fb950" stroke-width="1.3" fill="none"/>
  <text x="176" y="28" font-family="Menlo, monospace" font-size="12.5" fill="#c9d1d9">github.com/kuzensky</text>

  <!-- refresh icon -->
  <circle cx="580" cy="24" r="9" fill="none" stroke="#8b949e" stroke-width="1.4"/>
  <path d="M580,17 l3,3 h-6 z" fill="#8b949e"/>

  <!-- Content area -->
  <rect x="1" y="49" width="698" height="370" fill="#0d1117"/>

  <g clip-path="url(#contentClip)">
    <text x="34" y="100" font-family="Menlo, monospace" font-size="14" fill="#3fb950">kuzensky@github</text>
    <text x="180" y="100" font-family="Menlo, monospace" font-size="14" fill="#8b949e">:~$ whoami</text>

    <text x="34" y="140" font-family="Menlo, monospace" font-size="26" font-weight="700" fill="#f0f6fc">Christian Nayre</text>
    <text x="34" y="170" font-family="Menlo, monospace" font-size="16" fill="#58a6ff">Full-Stack Developer</text>

    <text x="34" y="220" font-family="Menlo, monospace" font-size="14" fill="#3fb950">kuzensky@github</text>
    <text x="180" y="220" font-family="Menlo, monospace" font-size="14" fill="#8b949e">:~$ cat status.txt</text>
    <text x="34" y="252" font-family="Menlo, monospace" font-size="14" fill="#c9d1d9">Building Kabi @ Pocket Devs</text>
    <text x="34" y="278" font-family="Menlo, monospace" font-size="14" fill="#c9d1d9">Running Theoraux on the side</text>
    <text x="34" y="304" font-family="Menlo, monospace" font-size="14" fill="#c9d1d9">Open to internships</text>

    <line x1="34" y1="336" x2="666" y2="336" stroke="#21262d" stroke-width="1"/>

    <text x="34" y="366" font-family="Menlo, monospace" font-size="12" fill="#8b949e">Repos</text>
    <text x="34" y="388" font-family="Menlo, monospace" font-size="20" font-weight="700" fill="#f0f6fc">4</text>

    <text x="200" y="366" font-family="Menlo, monospace" font-size="12" fill="#8b949e">Followers</text>
    <text x="200" y="388" font-family="Menlo, monospace" font-size="20" font-weight="700" fill="#f0f6fc">1</text>

    <text x="400" y="366" font-family="Menlo, monospace" font-size="12" fill="#8b949e">Activity</text>
    <text x="400" y="388" font-family="Menlo, monospace" font-size="20" font-weight="700" fill="#f0f6fc">354</text>

    <rect x="530" y="374" width="9" height="16" fill="#c9d1d9">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
